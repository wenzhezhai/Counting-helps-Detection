[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "counting-help-detection"
version = "0.1.0"
description = "Reproducible fixed-candidate detection experiments with independent counting points"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<2.3", "scipy>=1.11", "Pillow>=10", "pycocotools==2.0.11"]

[tool.setuptools.packages.find]
where = ["src"]
